name: Build and Publish

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - shell: bash
        run: |
          set +e
          uv run pytest
          rc=$?
          set -e
          [[ "$rc" -eq 0 || "$rc" -eq 5 ]]

  publish:
    runs-on: ubuntu-latest
    needs: test
    # Only a published GitHub Release ships to PyPI; a push to main just runs the tests.
    if: github.event_name == 'release'
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups

      - name: Check the release tag matches pyproject.toml
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import pathlib
          import re
          import urllib.request

          pyproject = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          m = re.search(r'^version\s*=\s*"([^"]+)"', pyproject, re.MULTILINE)
          if not m:
              raise SystemExit("Could not read version from pyproject.toml")
          version = m.group(1)

          tag = os.environ["TAG_NAME"].lstrip("v")
          if tag != version:
              raise SystemExit(
                  f"Release tag {os.environ['TAG_NAME']} does not match "
                  f"pyproject.toml version {version}; refusing to publish."
              )

          with urllib.request.urlopen(
              "https://pypi.org/pypi/facebook-ads-reports/json", timeout=15
          ) as r:
              data = json.load(r)
          exists = version in data.get("releases", {})

          print(f"version={version}")
          print(f"exists={'true' if exists else 'false'}")
          PY

      - run: uv build

      - name: Publish to PyPI
        if: steps.version.outputs.exists != 'true'
        run: uv publish --check-url https://pypi.org/simple/
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Skip publish
        if: steps.version.outputs.exists == 'true'
        run: echo "Version ${{ steps.version.outputs.version }} already exists on PyPI; skipping publish."
